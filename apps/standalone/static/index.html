<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniWatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
:root{
  --bg:#0b0b12; --panel:#13131d; --panel2:#1a1a27; --line:#262636; --text:#ececf4; --muted:#8b8ba3;
  --accent:#7c6cff; --accent2:#b18cff; --eye:#ffb547; --ok:#3ddc97;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 Inter,system-ui,sans-serif;
  background-image:radial-gradient(1200px 600px at 80% -10%,#2a1f5c55,transparent),radial-gradient(900px 500px at -10% 10%,#1b2f5c44,transparent);min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em;cursor:pointer}
.logo .dot{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--eye),var(--accent));display:grid;place-items:center}
.logo .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--bg)}
.pill{font:600 12px/1 "JetBrains Mono",monospace;color:var(--accent2);border:1px solid #3a2f7a;background:#1c1638;padding:7px 11px;border-radius:99px}

.hero{max-width:820px;margin:7vh auto 0;text-align:center;padding:0 20px}
.hero h1{font-size:clamp(34px,5.4vw,58px);line-height:1.05;letter-spacing:-.035em;margin:0 0 16px;font-weight:800}
.hero h1 span{background:linear-gradient(90deg,var(--accent2),var(--eye));-webkit-background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:17px;margin:0 auto 28px;max-width:640px}
.ask{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px #0008;text-align:left;overflow:hidden}
.ask .url{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ask .url span{font:600 11px "JetBrains Mono",monospace;color:var(--muted);letter-spacing:.08em}
.ask input,.ask textarea,.follow textarea{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:500 15px Inter;min-width:0;resize:none}
.ask textarea{display:block;width:100%;padding:16px 18px 6px;font-size:18px;font-weight:600;line-height:1.4;min-height:84px}
.ask textarea::placeholder,.follow textarea::placeholder{color:#5d5d78}
.ask .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 12px 18px}
.hint{font-size:12.5px;color:var(--muted)}
.btn{border:0;border-radius:11px;padding:11px 20px;font:700 15px Inter;color:white;cursor:pointer;white-space:nowrap;
  background:linear-gradient(135deg,var(--accent),#9a5cff)}
.btn:disabled{opacity:.5;cursor:default}
.modes{display:flex;gap:6px;padding:12px 14px 0}
.modes button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:99px;
  padding:6px 14px;font:600 13px Inter;cursor:pointer}
.modes button.on{background:#221b45;border-color:#3a2f7a;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{font:500 13px Inter;color:#c9c9dc;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:6px 13px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:#fff}
body.running .hero{display:none}

main{display:none;max-width:1320px;margin:6px auto 60px;padding:0 20px;grid-template-columns:420px 1fr;gap:22px;align-items:start}
body.running main{display:grid}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.left{position:sticky;top:16px;display:flex;flex-direction:column;gap:16px}
.player{aspect-ratio:16/9;width:100%;border-radius:12px;border:0;background:#000}
.meta h2{font-size:17px;line-height:1.35;margin:12px 0 2px}
.meta div{color:var(--muted);font-size:13px}
.newvid{font:600 12px Inter;color:var(--accent2);cursor:pointer;margin-top:8px;display:inline-block}

.steps{display:flex;flex-direction:column;gap:9px}
.step{display:flex;align-items:center;gap:11px;color:var(--muted);font-weight:500;font-size:14px}
.step i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;flex:none}
.step.active{color:var(--text)} .step.active i{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.step.done{color:var(--text)} .step.done i{border-color:var(--ok);background:var(--ok);color:#06200f}
.step.done i::after{content:"✓";font-weight:800}
.step small{margin-left:auto;font:500 12px "JetBrains Mono",monospace;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.label{font:700 11px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.timer{font:600 13px "JetBrains Mono",monospace;color:var(--accent2);letter-spacing:0}

.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px}
.clip{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
.clip img{width:100%;height:100%;object-fit:cover;opacity:.25;filter:grayscale(1);transition:all .4s}
.clip span{position:absolute;left:5px;bottom:4px;font:600 10px "JetBrains Mono",monospace;background:#000a;padding:1px 5px;border-radius:4px}
.clip.watching{border-color:var(--accent)} .clip.watching img{opacity:.8;filter:none}
.clip.watching::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#7c6cff88,transparent);width:40%;animation:scan 1.1s ease-in-out infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.clip.done img{opacity:1;filter:none} .clip.done{border-color:#2d6b52}
.clip.done::before{content:"✓";position:absolute;top:3px;right:4px;z-index:2;width:16px;height:16px;border-radius:50%;background:var(--ok);color:#06200f;font:800 10px/16px Inter;text-align:center}
.clip.hit{border-color:var(--eye);box-shadow:0 0 0 1px var(--eye),0 0 18px #ffb54755}
.clip.hit::before{content:"★";background:var(--eye);color:#2a1b00}
.clip.miss img{opacity:.22;filter:grayscale(1)} .clip.miss{border-color:var(--line)}
.clip.miss::before{content:"–";background:#3a3a50;color:#aaa}
.legend{display:none;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend b{color:var(--eye)}

.right{display:flex;flex-direction:column;gap:18px;min-width:0}
.follow{display:none;background:var(--panel);border:1px solid #3a2f7a;border-radius:18px;padding:14px 14px 12px 18px;box-shadow:0 0 0 4px #7c6cff14}
.follow .row{display:flex;gap:10px;align-items:flex-end}
.follow textarea{font-size:16px;font-weight:600;padding:6px 0;min-height:30px}
.follow .chips{justify-content:flex-start;margin-top:10px}
body.idle .follow{display:block}

.qa .q{display:flex;gap:12px;align-items:flex-start;font-size:19px;font-weight:700;line-height:1.35;letter-spacing:-.01em;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.qa .q .ico{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#221b45;border:1px solid #3a2f7a;font-size:15px}
.qa .stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font:500 12px "JetBrains Mono",monospace;color:var(--muted)}
.qa .stats b{color:var(--text)}
.qa.old{opacity:.85}
.pending{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:10px}
.pending::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}

.md{font-size:15.5px}
.md h2{font-size:12.5px;font-family:"JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--accent2);margin:26px 0 12px}
.md h2:first-child{margin-top:0}
.md h2.answer + p,.md h2.answer + p + p{font-size:17px;line-height:1.65;color:#f4f4fa}
.md ul{padding-left:0;list-style:none;margin:0}
.md li{position:relative;padding-left:20px;margin:7px 0}
.md li::before{content:"";position:absolute;left:3px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.md p{margin:8px 0}
.md strong{color:#fff}
.md code{font:500 13px "JetBrains Mono",monospace;background:var(--panel2);padding:1px 6px;border-radius:5px}
.ts{font:600 12px "JetBrains Mono",monospace;color:var(--accent2);background:#221b45;border:1px solid #3a2f7a;border-radius:6px;padding:1px 7px;cursor:pointer;margin-right:4px}
.ts:hover{background:var(--accent);color:#fff}
.visual{background:linear-gradient(180deg,#2a1e0a55,transparent);border:1px solid #5c4214;border-radius:14px;padding:14px 16px 6px}
.visual-badge{display:inline-flex;gap:6px;align-items:center;font:700 11px "JetBrains Mono",monospace;color:var(--eye);background:#3a2808;border:1px solid #6b4a12;padding:4px 9px;border-radius:99px;margin-bottom:10px}
.visual li{display:grid;grid-template-columns:168px 1fr;gap:14px;padding:0 0 12px;margin:0 0 12px;border-bottom:1px dashed #4a3614}
.visual li:last-child{border:0;margin-bottom:4px}
.visual li::before{display:none}
.visual li img{width:168px;border-radius:9px;border:1px solid #6b4a12}
.tl li{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;padding-left:0}
.tl li::before{display:none}
.tl li img{width:96px;border-radius:6px}

.strip.scanning .clip img{opacity:.85;filter:none}
.strip.scanning .clip::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#7c6cff88,transparent);width:40%;animation:scan 1.4s ease-in-out infinite}
.parts{display:flex;gap:4px;margin-top:10px}
.parts i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.parts i.on{background:var(--accent);animation:pulse 1s infinite} .parts i.ok{background:var(--ok);animation:none}
@keyframes pulse{50%{opacity:.4}}
.err{color:#ff8fa3;white-space:pre-wrap;font:13px "JetBrains Mono",monospace}
@media (max-width:980px){main{grid-template-columns:1fr}.left{position:static}}
@media (max-width:560px){header{padding:14px 16px}.pill{display:none}.ask .bar{flex-direction:column;align-items:stretch}
  .visual li{grid-template-columns:1fr}.visual li img{width:100%}}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="location.reload()"><div class="dot"></div>OmniWatch</div>
  <div style="display:flex;align-items:center;gap:10px">
    <select id="lang" class="pill" style="cursor:pointer;outline:0"></select>
    <div class="pill">Qwen3.8-Omni-Flash</div>
  </div>
</header>

<section class="hero">
  <h1><span id="t1"></span><br><span id="t2"></span></h1>
  <p id="lead"></p>
  <form class="ask" id="f">
    <div class="url"><span id="linkLabel"></span><input id="url" autocomplete="off"></div>
    <div class="modes"><button type="button" id="mAsk" class="on"></button><button type="button" id="mTear"></button></div>
    <textarea id="q" rows="2"></textarea>
    <div class="bar"><span class="hint" id="hint"></span><button class="btn" id="go"></button></div>
  </form>
  <div class="chips" id="heroChips"></div>
</section>

<main>
  <div class="left">
    <div class="card">
      <video id="player" class="player" controls preload="metadata" playsinline></video>
      <div class="meta"><h2 id="title"></h2><div id="sub">&nbsp;</div>
        <span class="newvid" id="newvid" onclick="location.reload()"></span></div>
    </div>
    <div class="card">
      <div class="label" style="justify-content:space-between"><span id="progressLabel"></span><span class="timer" id="timer">0.0s</span></div>
      <div class="steps">
        <div class="step" data-s="download"><i></i><span id="stepDownload"></span><small></small></div>
        <div class="step" data-s="upload"><i></i><span id="stepUpload"></span><small id="upinfo"></small></div>
        <div class="step" data-s="watch"><i></i><span id="watchLabel"></span><small id="wcount"></small></div>
        <div class="step" data-s="answer"><i></i><span id="stepAnswer"></span><small></small></div>
      </div>
      <div class="parts" id="parts" style="display:none"></div>
    </div>
    <div class="card" id="stripCard" style="display:none">
      <div class="label" id="stripLabel"></div>
      <div class="strip" id="strip"></div>
      <div class="legend" id="legend"><span></span></div>
    </div>
  </div>

  <div class="right">
    <div class="follow">
      <div class="label" id="followTitle"></div>
      <div class="row"><textarea id="q2" rows="1"></textarea><button class="btn" id="go2"></button></div>
      <div class="chips" id="followChips"></div>
    </div>
    <div id="answers" style="display:flex;flex-direction:column;gap:18px"></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let mode = 'ask';
let I18N = {}, lang = localStorage.getItem('omniwatch-lang') || (navigator.language || 'en').slice(0, 2);
const T = () => (I18N[lang] || I18N.en).ui, S = () => (I18N[lang] || I18N.en).sections;
const fill = (id, key, html) => { const el = $('#' + id); if (el) el[html ? 'innerHTML' : 'textContent'] = T()[key]; };
const ph = (id, key) => { const el = $('#' + id); if (el) el.placeholder = T()[key]; };

function applyLang() {
  document.documentElement.lang = lang;
  localStorage.setItem('omniwatch-lang', lang);
  fill('t1', 'tagline1'); fill('t2', 'tagline2'); fill('lead', 'lead', true);
  fill('linkLabel', 'linkLabel'); fill('hint', 'hint'); fill('go', 'submit'); fill('go2', 'followSubmit');
  fill('progressLabel', 'progress'); fill('stepDownload', 'stepDownload'); fill('stepUpload', 'stepUpload');
  fill('stepAnswer', 'stepAnswer'); fill('stripLabel', 'filmstrip'); fill('followTitle', 'followTitle');
  fill('newvid', 'otherVideo');
  ph('url', 'urlPlaceholder'); ph('q2', 'followPlaceholder');
  fill('mAsk', 'modeAsk'); fill('mTear', 'modeTeardown');
  setMode(mode);
  $('#legend').querySelector('span').innerHTML = T().legend;
  $('#watchLabel').textContent = T().stepWatchOne;
  if (!$('#title').textContent || !document.body.classList.contains('running')) $('#title').textContent = T().fetching;
  chips($('#heroChips'), '#q'); chips($('#followChips'), '#q2', () => ask($('#q2').value));
}
let vid = null, url = null, strip = [], seconds = 0, t0 = 0, timerId = null, es = null, card = null, question = '', partsDone = 0, lastAnswer = '';
const toSec = t => t.split(':').map(Number).reduce((a, b) => a * 60 + b, 0);
const fmt = s => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`; };
const frame = s => `/frame/${vid}/${Math.max(0, Math.floor(s))}.jpg`;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

function setMode(m) {
  mode = m;
  $('#mAsk').classList.toggle('on', m === 'ask'); $('#mTear').classList.toggle('on', m === 'teardown');
  $('#q').placeholder = m === 'teardown' ? T().teardownPlaceholder : T().questionPlaceholder;
  $('#go').textContent = m === 'teardown' ? T().teardownSubmit : T().submit;
  $('#heroChips').style.display = m === 'teardown' ? 'none' : 'flex';
  $('#hint').style.visibility = m === 'teardown' ? 'hidden' : 'visible';
}
$('#mAsk').onclick = () => setMode('ask');
$('#mTear').onclick = () => setMode('teardown');

function chips(el, target, submit) {
  el.innerHTML = T().examples.map(e => `<span class="chip">${esc(e)}</span>`).join('');
  el.onclick = e => { const c = e.target.closest('.chip'); if (!c) return; $(target).value = c.textContent; $(target).focus(); if (submit) submit(); };
}
fetch('/i18n.json').then(r => r.json()).then(d => {
  I18N = d;
  if (!I18N[lang]) lang = 'en';
  $('#lang').innerHTML = Object.entries(I18N).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('');
  $('#lang').value = lang;
  $('#lang').onchange = e => { lang = e.target.value; applyLang(); };
  applyLang();
});

function seek(sec) {
  const p = $('#player');
  p.currentTime = sec; p.play().catch(() => {});
  p.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}
document.addEventListener('click', e => {
  const b = e.target.closest('.ts'); if (b) seek(+b.dataset.t);
  const c = e.target.closest('.clip'); if (c) seek(+c.dataset.t);
});

function setStep(step) {
  const order = ['download', 'upload', 'watch', 'answer'];
  document.querySelectorAll('.step').forEach(el => {
    const i = order.indexOf(el.dataset.s), cur = step === 'end' ? 99 : order.indexOf(step);
    el.className = 'step' + (i < cur ? ' done' : i === cur ? ' active' : '');
  });
}

const TS = /`?\[(\d{1,2}(?::\d{2}){1,2})(\s*[–-]\s*\d{1,2}(?::\d{2}){1,2})?\]`?/g;  // [m:ss] or a range [m:ss–m:ss]
const tsHtml = s => s.replace(TS, (_, t, r) => `<button class="ts" data-t="${toSec(t)}">▶ ${t}${r ? r.replace(/\s/g, '') : ''}</button>`);

function renderMd(el, text) {
  el.innerHTML = tsHtml(marked.parse(text));
  el.querySelectorAll('h2').forEach(h => {
    const sec = S(), title = h.textContent.trim().toLowerCase();
    const is = key => title === sec[key].toLowerCase();
    if (is('answer')) h.classList.add('answer');
    const ul = h.nextElementSibling;
    if (!ul || ul.tagName !== 'UL') return;
    if (is('beats') || is('text')) { ul.classList.add('tl'); decorate(ul, 1); return; }
    if (is('evidence') || is('visual')) {
      const box = document.createElement('div'); box.className = 'visual';
      box.innerHTML = `<div class="visual-badge">👁 ${is('evidence') ? T().badgeFrames : T().badgeVisual}</div>`;
      h.after(box); box.appendChild(ul); decorate(ul, 2);  // the model names a moment slightly before the visual peaks
    } else if (is('timeline') || is('jump')) { ul.classList.add('tl'); decorate(ul, 1); }
  });
}
function decorate(ul, lead) {
  ul.querySelectorAll(':scope > li').forEach(li => {
    const b = li.querySelector('.ts'); if (!b) return;
    const img = new Image(); img.src = frame(+b.dataset.t + lead); img.loading = 'lazy';
    const body = document.createElement('div');
    while (li.firstChild) body.appendChild(li.firstChild);
    li.append(img, body);
  });
}

function highlight(text) {  // light up the strip tiles whose span contains a timestamp the answer cites
  const cited = [...text.matchAll(TS)].map(m => toSec(m[1]));
  const span = seconds / strip.length;
  document.querySelectorAll('.clip').forEach((c, i) => {
    const hit = cited.some(t => t >= i * span && t < (i + 1) * span);
    c.classList.toggle('hit', hit);
    const t = cited.find(t => t >= i * span && t < (i + 1) * span);
    if (hit) { c.dataset.t = t; c.querySelector('img').src = frame(t + 1); c.querySelector('span').textContent = fmt(t); }
  });
  $('#legend').style.display = cited.length ? 'flex' : 'none';
}

function newCard(q) {
  document.querySelectorAll('.qa').forEach(c => c.classList.add('old'));
  card = document.createElement('div'); card.className = 'card qa';
  const tear = mode === 'teardown';
  card.innerHTML = `<div class="q"><span class="ico">${tear ? '🔧' : q ? '❓' : '📋'}</span><span>${tear ? T().teardownCard + (q ? ` — ${esc(q)}` : '') : q ? esc(q) : T().summaryCard}</span></div>
    <div class="md"><div class="pending" id="pending">${T().pendingDownload}</div></div>`;
  $('#answers').prepend(card);
}
const pending = t => { const p = card.querySelector('.pending'); if (p) p.textContent = t; };

function ask(q) {
  if (es) return;
  q = (q || '').trim(); question = q;
  if (document.querySelector('.qa') && mode === 'teardown') setMode('ask');  // follow-ups are questions
  document.body.classList.add('running'); document.body.classList.remove('idle');
  $('#go').disabled = $('#go2').disabled = true; $('#q2').value = '';
  $('#legend').style.display = 'none'; $('#parts').style.display = 'none'; $('#wcount').textContent = ''; $('#upinfo').textContent = '';
  partsDone = 0; lastAnswer = ''; newCard(q); window.scrollTo({top: 0, behavior: 'smooth'});
  t0 = performance.now(); clearInterval(timerId);
  timerId = setInterval(() => $('#timer').textContent = ((performance.now() - t0) / 1000).toFixed(1) + 's', 100);

  es = new EventSource(`/api/watch?url=${encodeURIComponent(url)}&q=${encodeURIComponent(q)}&lang=${lang}&mode=${mode}`);
  const on = (ev, fn) => es.addEventListener(ev, e => fn(JSON.parse(e.data)));
  const finish = () => { es.close(); es = null; clearInterval(timerId); $('#strip').classList.remove('scanning'); $('#go').disabled = $('#go2').disabled = false; };
  on('stage', d => {
    setStep(d.step);
    if (d.step === 'upload') pending(T().pendingUpload);
    if (d.step === 'watch') { $('#strip').classList.add('scanning'); $('#watchLabel').textContent += ` · ${d.fps} fps`;
      pending(d.parts > 1 ? T().pendingWatchMany.replace('{n}', d.parts) : T().pendingWatchOne.replace('{fps}', d.fps)); }
    if (d.step === 'answer') $('#strip').classList.remove('scanning');
  });
  on('meta', d => {
    $('#title').textContent = d.title; $('#sub').textContent = `${d.channel} · ${d.duration}`;
    seconds = d.seconds;
    if (vid !== d.id) {
      vid = d.id; strip = d.strip;
      $('#player').src = `/video/${d.id}.mp4`;
      $('#stripCard').style.display = '';
      $('#strip').innerHTML = strip.map(t => `<div class="clip" data-t="${t}"><img src="${frame(t)}"><span>${fmt(t)}</span></div>`).join('');
    } else document.querySelectorAll('.clip').forEach((c, i) => { c.classList.remove('hit'); c.dataset.t = strip[i]; c.querySelector('img').src = frame(strip[i]); c.querySelector('span').textContent = fmt(strip[i]); });
  });
  on('parts', d => {
    $('#watchLabel').textContent = d.n > 1 ? T().stepWatchMany.replace('{n}', d.n) : T().stepWatchOne;
    if (d.n > 1) { $('#parts').style.display = 'flex'; $('#parts').innerHTML = '<i class="on"></i>'.repeat(d.n); $('#wcount').textContent = `0/${d.n}`; }
  });
  on('uploaded', d => { $('#upinfo').textContent = d.reused ? T().cached : ''; });
  on('part_done', d => { $('#parts').children[d.i].className = 'ok'; $('#wcount').textContent = `${++partsDone}/${$('#parts').children.length}`; });
  on('merge', () => pending(T().pendingMerge));
  on('answer', d => { lastAnswer = d.text; renderMd(card.querySelector('.md'), d.text); });
  on('done', d => {
    finish(); setStep('end'); document.body.classList.add('idle');
    highlight(lastAnswer);
    card.insertAdjacentHTML('beforeend', `<div class="stats"><span>⏱ <b>${d.seconds}s</b></span>${d.parts > 1 ? `<span>${T().statParts.replace('{n}', d.parts)}</span>` : ''}<span>💰 <b>$${d.cost.toFixed(3)}</b> · ${(d.tokens / 1000).toFixed(0)}k tokenów</span>${d.reused ? `<span>${T().statReused}</span>` : ''}</div>`);
    $('#q2').focus();
  });
  on('error', d => { finish(); card.querySelector('.md').innerHTML = `<div class="err">⚠ ${esc(d.message)}</div>`; });
  es.onerror = () => { if (es) finish(); };  // never auto-reconnect: that would restart the whole job
}

$('#f').addEventListener('submit', e => { e.preventDefault(); url = $('#url').value.trim(); if (url) ask($('#q').value); });
$('#go2').addEventListener('click', () => ask($('#q2').value));
for (const [ta, fn] of [['#q', () => $('#f').requestSubmit()], ['#q2', () => ask($('#q2').value)]])
  $(ta).addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey || (ta === '#q2' && !e.shiftKey))) { e.preventDefault(); fn(); } });
</script>
</body>
</html>
